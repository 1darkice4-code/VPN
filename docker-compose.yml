version: "3.8"

services:
  # PostgreSQL база данных
  db:
    image: postgres:12
    container_name: vpn_db
    restart: always
    environment:
      POSTGRES_DB: vpn_bot_db
      POSTGRES_USER: vpn_bot_user
      POSTGRES_PASSWORD: post123
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./SQL:/docker-entrypoint-initdb.d
    networks:
      - vpn_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpn_bot_user -d vpn_bot_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # WireGuard VPN сервер (управляется через wgREST)
  wg:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wg
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Moscow
      - SERVERURL=wg.example.com
      - SERVERPORT=51830
      - INTERNAL_SUBNET=10.66.66.0
    volumes:
      - ./wg:/config
    ports:
      - "51830:51830/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      - vpn_network
    restart: unless-stopped
    # НЕ используем PEERS=10 - будем создавать пиров через wgREST

  # REST API для управления WireGuard
  wgrest:
    build: ./wgrest
    container_name: wgrest
    depends_on:
      - wg
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE
    network_mode: host  # Используем host network для доступа к WireGuard
    environment:
      WGREST_LISTEN: 0.0.0.0:8080
      WGREST_DATA_DIR: /var/lib/wgrest
    volumes:
      - ./wg:/config
      - wgrest_data:/var/lib/wgrest
    restart: unless-stopped

  # Telegram бот
  vpn_bot:
    build: ./vpn_bot
    container_name: vpn_bot
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./vpn_bot/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: vpn_bot_db
      DB_USER: vpn_bot_user
      DB_PASSWORD: post123
    volumes:
      - ./wg:/wg
    working_dir: /app
    networks:
      - vpn_network
    restart: unless-stopped

networks:
  vpn_network:
    driver: bridge

volumes:
  db_data:
  wgrest_data:
